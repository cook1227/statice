<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef168f">
  <title>Statice Goods Register</title>

  <style>
    :root {
      --pink: #ef168f;
      --pink-dark: #c90f74;
      --pink-soft: #fff0f7;
      --ink: #33242d;
      --muted: #8b7882;
      --line: #f1d8e5;
      --paper: rgba(255, 240, 247, 0.94);
      --shadow: 0 14px 40px rgba(142, 36, 91, 0.10);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(239, 22, 143, 0.05), transparent 34rem),
        #fff;
      font-family:
        -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .page {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 0 16px 72px;
    }

    .hero {
      margin: 0 -16px;
      background: var(--pink);
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      max-width: 1080px;
      height: auto;
      margin: 0 auto;
    }

    .sticky-total {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0 -16px 22px;
      padding: 10px 16px;
      background: rgba(255, 240, 247, 0.92);
      border-bottom: 1px solid rgba(239, 22, 143, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(111, 35, 73, 0.06);
    }

    .sticky-inner {
      width: min(100%, 1048px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .sticky-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .sticky-price {
      color: var(--pink);
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin: 28px 0 18px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(22px, 4.5vw, 34px);
      letter-spacing: 0.02em;
    }

    .intro p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .reset-top {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--pink-soft);
      color: var(--muted);
      box-shadow: 0 4px 18px rgba(75, 36, 55, 0.08);
      cursor: pointer;
      white-space: nowrap;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 112px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid rgba(239, 22, 143, 0.09);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(124, 48, 87, 0.06);
    }

    .product.is-selected {
      border-color: rgba(239, 22, 143, 0.28);
      box-shadow: 0 10px 30px rgba(239, 22, 143, 0.09);
    }

    .product-name {
      margin: 0 0 7px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 750;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }

    .unit-price {
      color: var(--pink-dark);
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .subtotal {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .qty-control {
      display: grid;
      grid-template-columns: 38px 42px 38px;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--pink-soft);
    }

    .qty-button {
      width: 38px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--pink);
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
    }

    .qty-button:active {
      background: var(--pink-soft);
    }

    .qty {
      min-width: 42px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .receipt-wrap {
      margin-top: 34px;
    }

    .receipt-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .receipt {
      overflow: hidden;
      background: var(--pink-soft);
      border: 1px solid rgba(239, 22, 143, 0.13);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .receipt-head {
      padding: 20px 22px 18px;
      background: linear-gradient(135deg, var(--pink) 0%, #f53da1 100%);
      color: #fff;
    }

    .receipt-head small {
      display: block;
      margin-bottom: 4px;
      opacity: 0.82;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .receipt-head strong {
      font-size: 22px;
    }

    .receipt-body {
      padding: 6px 22px 22px;
    }

    .receipt-empty {
      padding: 28px 0 20px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .receipt-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px dashed var(--line);
    }

    .receipt-row-name {
      font-weight: 700;
      line-height: 1.45;
    }

    .receipt-row-detail {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .receipt-row-price {
      align-self: center;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .receipt-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-top: 20px;
    }

    .receipt-total-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .receipt-total-price {
      color: var(--pink);
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      min-height: 52px;
      border-radius: 16px;
      border: 0;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .action-primary {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 10px 24px rgba(239, 22, 143, 0.22);
    }

    .action-secondary {
      background: var(--pink-soft);
      color: var(--pink-dark);
      border: 1px solid rgba(239, 22, 143, 0.18);
    }

    .notice {
      min-height: 22px;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .footer {
      margin-top: 36px;
      color: #ae929f;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      .products {
        grid-template-columns: 1fr;
      }

      .intro {
        align-items: start;
      }

      .product {
        min-height: 104px;
        padding: 16px;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero,
      .sticky-total {
        margin-left: -12px;
        margin-right: -12px;
      }

      .sticky-total {
        padding-left: 12px;
        padding-right: 12px;
      }

      .intro {
        display: block;
      }

      .reset-top {
        margin-top: 12px;
      }

      .product {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
      }

      .qty-control {
        grid-template-columns: 34px 36px 34px;
      }

      .qty-button {
        width: 34px;
        height: 40px;
      }

      .qty {
        min-width: 36px;
      }

      .receipt-body {
        padding-left: 18px;
        padding-right: 18px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="hero">
      <img id="headerImage" src="header.png" alt="Statice UCKSDA MAAYA Line House Tour 2026">
    </header>

    <div class="sticky-total" aria-live="polite">
      <div class="sticky-inner">
        <div class="sticky-label">CURRENT TOTAL</div>
        <div class="sticky-price" id="stickyTotal">￥0</div>
      </div>
    </div>

    <main>
      <section class="intro">
        <div>
          <h1>Goods Register</h1>
          <p>買うグッズの数量を入れるだけ。小計と合計を自動計算します。</p>
        </div>
        <button class="reset-top" id="resetButton" type="button">数量をすべて0に戻す</button>
      </section>

      <section class="products" id="productList" aria-label="グッズ一覧"></section>

      <section class="receipt-wrap" id="receiptSection">
        <h2 class="receipt-title">購入リスト</h2>

        <div class="receipt" id="receipt">
          <div class="receipt-head">
            <small>STATICE GOODS</small>
            <strong>MY SHOPPING LIST</strong>
          </div>

          <div class="receipt-body">
            <div id="receiptItems"></div>

            <div class="receipt-total">
              <div class="receipt-total-label">TOTAL</div>
              <div class="receipt-total-price" id="receiptTotal">￥0</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="action-button action-primary" id="saveImageButton" type="button">
            購入リストを画像で保存
          </button>

          <button class="action-button action-secondary" id="scrollTopButton" type="button">
            グッズ一覧に戻る
          </button>
        </div>

        <div class="notice" id="notice" aria-live="polite"></div>
      </section>
    </main>

    <div class="footer">Statice Goods Register</div>
  </div>

<script>
(function () {
  "use strict";

  var products = [
    { id: "pamphlet",   name: "パンフレット",             price: 4000 },
    { id: "tshirt",     name: "ドライTシャツ",             price: 3500 },
    { id: "uniform",    name: "ユニフォーム",              price: 7800 },
    { id: "shorts",     name: "ナイロンショートパンツ",      price: 5500 },
    { id: "hat",        name: "バケットハット",             price: 4000 },
    { id: "towel",      name: "バスタオル",                price: 4000 },
    { id: "sandals",    name: "シャワーサンダル",           price: 3500 },
    { id: "penlight",   name: "ペンライト",                price: 3500 },
    { id: "plush",      name: "ぬいぐるみポーチ",           price: 3000 },
    { id: "shopper",    name: "ショッパー",                 price: 900 },
    { id: "sticker",    name: "ステッカー",                 price: 600 },
    { id: "acrylic",    name: "アクリルスタンド",           price: 1500 }
  ];

  var MAX_QTY = 20;
  var STORAGE_KEY = "statice_goods_register_v1";
  var quantities = {};

  function yen(value) {
    return "￥" + Number(value).toLocaleString("ja-JP");
  }

  function loadQuantities() {
    products.forEach(function (p) {
      quantities[p.id] = 0;
    });

    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      products.forEach(function (p) {
        var n = parseInt(saved[p.id], 10);
        if (!isNaN(n)) {
          quantities[p.id] = Math.max(0, Math.min(MAX_QTY, n));
        }
      });
    } catch (e) {
      // localStorageが使えない環境では保存なしで動作
    }
  }

  function saveQuantities() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quantities));
    } catch (e) {}
  }

  function totalAmount() {
    return products.reduce(function (sum, p) {
      return sum + (p.price * quantities[p.id]);
    }, 0);
  }

  function selectedProducts() {
    return products.filter(function (p) {
      return quantities[p.id] > 0;
    });
  }

  function renderProducts() {
    var list = document.getElementById("productList");

    list.innerHTML = products.map(function (p) {
      var q = quantities[p.id];
      var subtotal = p.price * q;

      return [
        '<article class="product' + (q > 0 ? ' is-selected' : '') + '" data-id="' + p.id + '">',
          '<div>',
            '<h2 class="product-name">' + p.name + '</h2>',
            '<div class="product-meta">',
              '<span class="unit-price">' + yen(p.price) + '</span>',
              '<span class="subtotal">小計 ' + yen(subtotal) + '</span>',
            '</div>',
          '</div>',

          '<div class="qty-control" aria-label="' + p.name + 'の数量">',
            '<button class="qty-button minus" type="button" aria-label="' + p.name + 'を1個減らす">−</button>',
            '<span class="qty" aria-live="polite">' + q + '</span>',
            '<button class="qty-button plus" type="button" aria-label="' + p.name + 'を1個増やす">＋</button>',
          '</div>',
        '</article>'
      ].join("");
    }).join("");
  }

  function renderReceipt() {
    var selected = selectedProducts();
    var box = document.getElementById("receiptItems");

    if (selected.length === 0) {
      box.innerHTML = '<div class="receipt-empty">まだ商品が選ばれていません</div>';
    } else {
      box.innerHTML = selected.map(function (p) {
        var q = quantities[p.id];
        var subtotal = p.price * q;

        return [
          '<div class="receipt-row">',
            '<div>',
              '<div class="receipt-row-name">' + p.name + '</div>',
              '<div class="receipt-row-detail">' + yen(p.price) + ' × ' + q + '</div>',
            '</div>',
            '<div class="receipt-row-price">' + yen(subtotal) + '</div>',
          '</div>'
        ].join("");
      }).join("");
    }

    var total = totalAmount();
    document.getElementById("receiptTotal").textContent = yen(total);
    document.getElementById("stickyTotal").textContent = yen(total);
  }

  function updateAll() {
    renderProducts();
    renderReceipt();
    saveQuantities();
  }

  function changeQuantity(id, delta) {
    var next = (quantities[id] || 0) + delta;
    quantities[id] = Math.max(0, Math.min(MAX_QTY, next));
    updateAll();
  }

  document.getElementById("productList").addEventListener("click", function (event) {
    var button = event.target.closest(".qty-button");
    if (!button) return;

    var card = button.closest(".product");
    var id = card.getAttribute("data-id");

    if (button.classList.contains("plus")) {
      changeQuantity(id, 1);
    } else if (button.classList.contains("minus")) {
      changeQuantity(id, -1);
    }
  });

  document.getElementById("resetButton").addEventListener("click", function () {
    if (totalAmount() === 0) return;

    if (!window.confirm("数量をすべて0に戻しますか？")) return;

    products.forEach(function (p) {
      quantities[p.id] = 0;
    });

    updateAll();
    document.getElementById("notice").textContent = "数量をリセットしました。";
  });

  document.getElementById("scrollTopButton").addEventListener("click", function () {
    document.querySelector(".intro").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  function roundedRect(ctx, x, y, w, h, r) {
    var radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function downloadCanvas(canvas) {
    if (canvas.toBlob) {
      canvas.toBlob(function (blob) {
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "statice-goods-" + new Date().toISOString().slice(0, 10) + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }, "image/png");
    } else {
      var a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "statice-goods.png";
      a.click();
    }
  }

  function saveReceiptImage() {
    var selected = selectedProducts();
    var notice = document.getElementById("notice");

    if (selected.length === 0) {
      notice.textContent = "商品を1つ以上選んでから画像保存してください。";
      return;
    }

    var button = document.getElementById("saveImageButton");
    button.disabled = true;
    button.textContent = "画像を作成中…";
    notice.textContent = "";

    try {
      var W = 1200;
      var padding = 72;
      var headerRatio = 640 / 200;
      var headerH = Math.round(W / headerRatio);
      var rowH = 104;
      var receiptTop = headerH + 52;
      var contentH = 170 + (selected.length * rowH) + 150;
      var H = receiptTop + contentH + 64;

      var canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext("2d");

      // background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);

      // header image
      var img = document.getElementById("headerImage");
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, 0, 0, W, headerH);
      } else {
        ctx.fillStyle = "#ef168f";
        ctx.fillRect(0, 0, W, headerH);
      }

      // receipt card
      var cardX = padding;
      var cardY = receiptTop;
      var cardW = W - padding * 2;
      var cardH = contentH;

      ctx.save();
      ctx.shadowColor = "rgba(112, 31, 70, 0.13)";
      ctx.shadowBlur = 32;
      ctx.shadowOffsetY = 10;
      roundedRect(ctx, cardX, cardY, cardW, cardH, 34);
      ctx.fillStyle = "#fff0f7";
      ctx.fill();
      ctx.restore();

      // pink receipt header
      roundedRect(ctx, cardX, cardY, cardW, 130, 34);
      ctx.fillStyle = "#ef168f";
      ctx.fill();
      ctx.fillStyle = "#ef168f";
      ctx.fillRect(cardX, cardY + 65, cardW, 65);

      ctx.fillStyle = "rgba(255,255,255,.82)";
      ctx.font = '700 24px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.fillText("STATICE GOODS", cardX + 46, cardY + 45);

      ctx.fillStyle = "#ffffff";
      ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.fillText("MY SHOPPING LIST", cardX + 46, cardY + 92);

      var y = cardY + 172;

      selected.forEach(function (p, index) {
        var q = quantities[p.id];
        var subtotal = p.price * q;

        ctx.fillStyle = "#33242d";
        ctx.font = '700 28px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';
        ctx.fillText(p.name, cardX + 46, y);

        ctx.fillStyle = "#8b7882";
        ctx.font = '500 21px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
        ctx.fillText(yen(p.price) + " × " + q, cardX + 46, y + 34);

        ctx.textAlign = "right";
        ctx.fillStyle = "#33242d";
        ctx.font = '750 28px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
        ctx.fillText(yen(subtotal), cardX + cardW - 46, y + 18);
        ctx.textAlign = "left";

        if (index < selected.length - 1) {
          ctx.strokeStyle = "#f1d8e5";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(cardX + 46, y + 66);
          ctx.lineTo(cardX + cardW - 46, y + 66);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        y += rowH;
      });

      // total line
      ctx.strokeStyle = "#efcddd";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cardX + 46, y - 6);
      ctx.lineTo(cardX + cardW - 46, y - 6);
      ctx.stroke();

      ctx.fillStyle = "#33242d";
      ctx.font = '800 25px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.fillText("TOTAL", cardX + 46, y + 62);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ef168f";
      ctx.font = '850 52px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.fillText(yen(totalAmount()), cardX + cardW - 46, y + 68);
      ctx.textAlign = "left";

      downloadCanvas(canvas);
      notice.textContent = "購入リストをPNG画像で保存しました。";
    } catch (e) {
      console.error(e);
      notice.textContent = "画像保存に失敗しました。ブラウザのスクリーンショット機能をご利用ください。";
    } finally {
      button.disabled = false;
      button.textContent = "購入リストを画像で保存";
    }
  }

  document.getElementById("saveImageButton").addEventListener("click", saveReceiptImage);

  loadQuantities();
  updateAll();
})();
</script>
</body>
</html>
